<svg xmlns="http://www.w3.org/2000/svg" width="300" height="300" viewBox="0 0 300 300">
  <!-- Marco de madera con esquinas a inglete. Se usa como border-image (slice 40):
       la veta corre a lo largo de cada lado. -->
  <defs>
    <filter id="h" x="0" y="0" width="100%" height="100%">
      <feTurbulence type="fractalNoise" baseFrequency="0.012 0.35" numOctaves="3" seed="4"/>
      <feColorMatrix values="0.9 0 0 0 -0.13  0.55 0 0 0 -0.11  0.3 0 0 0 -0.07  0 0 0 0 1"/>
      <feComposite in2="SourceGraphic" operator="in"/>
    </filter>
    <filter id="v" x="0" y="0" width="100%" height="100%">
      <feTurbulence type="fractalNoise" baseFrequency="0.35 0.012" numOctaves="3" seed="9"/>
      <feColorMatrix values="0.9 0 0 0 -0.13  0.55 0 0 0 -0.11  0.3 0 0 0 -0.07  0 0 0 0 1"/>
      <feComposite in2="SourceGraphic" operator="in"/>
    </filter>
  </defs>
  <polygon points="0,0 300,0 260,40 40,40" fill="#000" filter="url(#h)"/>
  <polygon points="0,300 300,300 260,260 40,260" fill="#000" filter="url(#h)"/>
  <polygon points="0,0 40,40 40,260 0,300" fill="#000" filter="url(#v)"/>
  <polygon points="300,0 300,300 260,260 260,40" fill="#000" filter="url(#v)"/>
  <!-- Sombras de los lados de abajo/derecha y uniones de las esquinas -->
  <polygon points="0,300 300,300 260,260 40,260" fill="#000" opacity="0.18"/>
  <polygon points="300,0 300,300 260,260 260,40" fill="#000" opacity="0.1"/>
  <polygon points="0,0 300,0 260,40 40,40" fill="#fff" opacity="0.06"/>
  <g stroke="#2a180c" stroke-width="2" opacity="0.6">
    <line x1="0" y1="0" x2="40" y2="40"/><line x1="300" y1="0" x2="260" y2="40"/>
    <line x1="0" y1="300" x2="40" y2="260"/><line x1="300" y1="300" x2="260" y2="260"/>
  </g>
  <rect x="1.5" y="1.5" width="297" height="297" fill="none" stroke="#2a180c" stroke-width="3"/>
  <rect x="39" y="39" width="222" height="222" fill="none" stroke="#24150a" stroke-width="3"/>
</svg>
